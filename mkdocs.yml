site_name: Sistema de Acompanhamento do Plano de Contratações Anual
site_description: >-
  Documentação técnica do Sistema de Acompanhamento do Plano de Contratações
  Anual (Sistema PCA) — Django 5.2 + PostgreSQL 17 + HTMX, server-rendered.
site_url: https://toniaum.github.io/sistema-pca/
repo_url: https://github.com/ToNiauM/sistema-pca
repo_name: ToNiauM/sistema-pca
edit_uri: edit/main/docs/
copyright: "MIT — Antônio Rodrigues de Sousa Júnior"
docs_dir: docs

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ToNiauM/sistema-pca

nav:
  - Começar:
      - Início: index.md
      - Visão geral: visao-geral.md
      - Desenvolvimento local: desenvolvimento-local.md
  - Entender:
      - Arquitetura: arquitetura.md
      - Estrutura do projeto: estrutura.md
      - Modelo de dados: modelo-de-dados.md
      - Fluxos de negócio: fluxos-de-negocio.md
      - Glossário: glossario.md
  - Operar:
      - Configuração: configuracao.md
      - Deployment: deployment.md
      - Operação: operacao.md
      - Segurança: seguranca.md
      - Troubleshooting: troubleshooting.md
  - Contribuir:
      - Contribuição: contribuicao.md
