{# chips de filtro ativo; "Limpar filtros" preserva o parâmetro exercício #}
{% if tags %}
<div class="dsgov-filtros-ativos mb-3" aria-label="Filtros ativos">
  {% for tag in tags %}
  <span class="br-tag interaction">
    <span>{{ tag.rotulo }}: {{ tag.valor }}</span>
    <a class="br-button circle small" href="{% url 'pca:tabela' %}?{{ tag.querystring }}"
       hx-get="{% url 'pca:tabela' %}?{{ tag.querystring }}" hx-target="#listagem" hx-push-url="true"
       aria-label="Remover filtro {{ tag.rotulo }}: {{ tag.valor }}">
      <i class="fas fa-times" aria-hidden="true"></i>
    </a>
  </span>
  {% endfor %}
  <a class="br-button small" href="{% url 'pca:tabela' %}?limpar=1{% if querystring_limpar %}&{{ querystring_limpar }}{% endif %}"
     hx-get="{% url 'pca:tabela' %}?limpar=1{% if querystring_limpar %}&{{ querystring_limpar }}{% endif %}" hx-target="#listagem" hx-push-url="true">
    <i class="fas fa-eraser mr-1" aria-hidden="true"></i>Limpar filtros
  </a>
</div>
{% endif %}
