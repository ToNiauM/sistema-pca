{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="d-flex align-items-center mb-4">
  <h1 class="mb-0">Trocar senha</h1>
</div>
<div class="row">
  <div class="col-md-8">
    <form method="post">
      {% csrf_token %}
      {{ form }}
      {% include "dsgov/_acoes_formulario.html" with url_cancelar=url_cancelar rotulo_salvar="Definir nova senha" %}
    </form>
    <form method="post" action="{% url 'core:logout' %}" class="mt-3">
      {% csrf_token %}
      <button class="br-button" type="submit">Sair</button>
    </form>
  </div>
</div>
{% endblock %}
