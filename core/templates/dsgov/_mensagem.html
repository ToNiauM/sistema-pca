<div class="br-message {{ tipo }}">
  <div class="icon"><i class="fas {{ icone }} fa-lg" aria-hidden="true"></i></div>
  <div class="content" role="alert"><span class="message-title">{{ titulo }}</span><span class="message-body"> {{ m }}</span></div>
  <div class="close">
    <button class="br-button circle small" type="button" aria-label="Fechar a mensagem"><i class="fas fa-times" aria-hidden="true"></i></button>
  </div>
</div>
