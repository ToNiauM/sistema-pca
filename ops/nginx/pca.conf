# nginx do host (fora do Docker), instalado manualmente em /etc/nginx/conf.d/
# Cloudflare precisa estar em SSL/TLS "Full (strict)", nunca "Flexible" (evita loop de redirect)
# topologia: Internet -> Cloudflare (TLS) -> este Nginx (TLS) -> Gunicorn em 127.0.0.1
server {
    server_name <dominio-da-vps>;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # nunca repassar o Host/X-Forwarded-Proto do cliente; decidido aqui a partir da conexão real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/<dominio-da-vps>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dominio-da-vps>/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = <dominio-da-vps>) {
        return 301 https://$host$request_uri;
    }

    server_name <dominio-da-vps>;
    listen 80;
    return 404;
}
