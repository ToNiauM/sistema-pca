# Nginx do host (fora do Docker) — template de referência para instalar em
# qualquer VPS que sirva este sistema. Não é executado pelo compose; é
# instalado manualmente em /etc/nginx/conf.d/ (ou sites-available/) no host.
#
# Pré-requisito obrigatório no Cloudflare: SSL/TLS -> Overview -> modo
# "Full (strict)". NUNCA "Flexible" — em Flexible o Cloudflare fala HTTP com
# a origem, o Django (atrás de SECURE_SSL_REDIRECT + SECURE_PROXY_SSL_HEADER)
# vê X-Forwarded-Proto=http e devolve 301 para https, e o Cloudflare segue
# esse 301 fazendo nova requisição HTTP — loop de redirect infinito.
# "Full (strict)" exige certificado válido na origem
# (Let's Encrypt via certbot cobre isso) e fecha o segundo salto TLS de
# ponta a ponta.
#
# Topologia completa: Internet -> Cloudflare (edge, TLS) -> este Nginx
# (TLS via Let's Encrypt) -> Gunicorn em 127.0.0.1:<porta do container web>.
# Dois saltos de proxy confiáveis antes do IP do cliente — é a contagem que
# config/settings/prod.py usa em AXES_IPWARE_PROXY_COUNT.
server {
    server_name <dominio-da-vps>;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Nunca repassar o Host/X-Forwarded-Proto que o cliente mandar —
        # este bloco é quem decide os dois, sempre a partir da conexão real
        # que o Nginx recebeu (do threat_model do plano).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fase 39 — o assistente responde de forma síncrona em até 90s
        # (prazo interno, IA_PRAZO_PERGUNTA_S) + margem; amostra
        # versionada — reaplicar manualmente no host, o executor não toca
        # o proxy real de produção.
        proxy_read_timeout 150s;
    }

    # Fase 42 — API JSON para as extensões SEI Pro (POST /api/sei/coleta pode
    # trazer um PDF em base64 no corpo). client_max_body_size do Nginx precisa
    # ficar ACIMA de API_MAX_CORPO_MB (10, .env) por causa do overhead do
    # base64 (~33%) + envelope JSON; amostra versionada — reaplicar
    # manualmente no host, o executor não toca o proxy real de produção.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 12m;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/<dominio-da-vps>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dominio-da-vps>/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = <dominio-da-vps>) {
        return 301 https://$host$request_uri;
    }

    server_name <dominio-da-vps>;
    listen 80;
    return 404;
}
