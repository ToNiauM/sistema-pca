name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-BR --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECURE_SSL_REDIRECT: "false"
      SECRET_KEY: ci
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Aplicar migrações
        run: python manage.py migrate --noinput

      - name: Suíte de testes
        run: python manage.py test --noinput --parallel 2

      - name: Conformidade DSGov (bloqueante)
        run: python3 ops/dsgov/verificar.py . --avisos-como-erros

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de documentação
        run: pip install -r requirements-docs.txt

      - name: mkdocs build --strict
        run: mkdocs build --strict
